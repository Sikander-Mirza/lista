<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ✅ Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-DB804EZ1GQ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-DB804EZ1GQ");
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ❌ REMOVED: title, meta description, canonical, og:*, twitter:*
      ✅ REASON: Each page's <Helmet> handles these
      ✅ react-snap captures Helmet output into each page's HTML
      ✅ No more duplicate tags
    -->

    <!-- ✅ JSON-LD Schemas — these are GLOBAL, keep them here -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.newlista.com/#organization",
        "name": "Newlista Ventures LLC",
        "url": "https://www.newlista.com/",
        "logo": "https://www.newlista.com/favicon.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.newlista.com/#website",
        "url": "https://www.newlista.com/",
        "name": "Newlista",
        "publisher": {
          "@id": "https://www.newlista.com/#organization"
        }
      }
    </script>

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://admin.newlista.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://admin.newlista.com" />

    <meta name="theme-color" content="#7C3AED" />

    <!-- ✅ Critical CSS -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Urbanist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        contain: layout style;
      }
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0f0f0f;
      }
      .initial-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #374151;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        will-change: transform;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- ✅ Non-blocking font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=Poppins:wght@600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
